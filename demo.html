<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWonder 测试页</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        color: #303133;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      .greeting {
        font-size: 24px;
        text-align: center;
        margin: 0 0 24px;
      }
      .demo-button {
        font-size: 16px;
        padding: 10px 28px;
        border: none;
        border-radius: 8px;
        background: #409eff;
        color: #ffffff;
        cursor: pointer;
      }
      .demo-button:hover {
        background: #66b1ff;
      }
    </style>
  </head>
  <body>
    <p id="greeting" class="greeting">Hello, AutoWonder!</p>
    <button id="demoButton" class="demo-button" type="button">点击我</button>
    <script>
      document.getElementById('demoButton').addEventListener('click', function () {
        alert('按钮被点击了！');
      });
    </script>
  </body>
</html>
